[project]
name = "invoice-search-service"
version = "0.1.0"
description = "Semantic search service for InvoiceGen using pgvector and OpenAI embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "openai>=1.51.0",
    "python-dotenv>=1.0.0",
    # JWT validation for the C# backend's HS256 bearer tokens. The [cryptography]
    # extra pulls in the backend used for signature verification.
    "python-jose[cryptography]>=3.3.0",
    # Langfuse observability. The LangChain integration ships inside the langfuse
    # package (langfuse.langchain.CallbackHandler); it needs langchain present to
    # activate. Keep these in sync with requirements.txt.
    "langfuse>=2.0.0",
    "langchain>=0.3.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle — стиль по PEP 8
    "F",        # pyflakes — неиспользуемые импорты и переменные, опечатки в именах
    "I",        # isort — порядок импортов
    "N",        # pep8-naming — snake_case, PascalCase
    "UP",       # pyupgrade — устаревшие конструкции на современные
    "B",        # flake8-bugbear — реальные ловушки, включая изменяемое умолчание
    "SIM",      # flake8-simplify — упрощение условий и циклов
    "RUF",      # собственные правила ruff
    "ASYNC",    # ошибки в асинхронном коде: блокирующие вызовы внутри async
    "S",        # bandit — безопасность, включая SQL-инъекции
]
ignore = [
    "E501",     # длину строк контролирует форматтер, не линтер
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]    # assert в тестах — это норма, bandit на него ругается

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "syrupy>=6.1.1",
]
