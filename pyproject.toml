[project]
name = "invoice-search-service"
version = "0.1.0"
description = "Semantic search service for InvoiceGen using pgvector and OpenAI embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "openai>=1.51.0",
    "python-dotenv>=1.0.0",
    # JWT validation for the C# backend's HS256 bearer tokens. The [cryptography]
    # extra pulls in the backend used for signature verification.
    "python-jose[cryptography]>=3.3.0",
    # Langfuse observability. The LangChain integration ships inside the langfuse
    # package (langfuse.langchain.CallbackHandler); it needs langchain present to
    # activate. Keep these in sync with requirements.txt.
    "langfuse>=2.0.0",
    "langchain>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
